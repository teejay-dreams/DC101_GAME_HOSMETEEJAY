<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock-Paper-Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Rock-Paper-Scissors</h1>

        <div class="score-board">
            <div class="player-score">
                <p>You</p>
                <span id="playerScore">0</span>
            </div>
            <div class="separator">:</div>
            <div class="computer-score">
                <p>Computer</p>
                <span id="computerScore">0</span>
            </div>
        </div>

        <div class="choices-area">
            <div class="choice" id="rock" onclick="playGame('rock')">
                <div class="choice-icon">✊</div>
                <p>Rock</p>
            </div>
            <div class="choice" id="paper" onclick="playGame('paper')">
                <div class="choice-icon">✋</div>
                <p>Paper</p>
            </div>
            <div class="choice" id="scissors" onclick="playGame('scissors')">
                <div class="choice-icon">✌️</div>
                <p>Scissors</p>
            </div>
        </div>

        <div class="result-area">
            <p id="resultText">Choose your move!</p>
            <div class="choices-display">
                <div class="player-choice-display">
                    <p>Your Choice</p>
                    <div id="playerChoice">-</div>
                </div>
                <div class="computer-choice-display">
                    <p>Computer's Choice</p>
                    <div id="computerChoice">-</div>
                </div>
            </div>
        </div>

        <button class="reset-btn" onclick="resetGame()">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
